name: Build Domain Hunter backend

on:
  push:
    branches: [main]
    paths:
      - 'dh/**'
      - 'alembic/**'
      - 'Dockerfile.python'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'compose.yml'
      - '.github/workflows/build.yml'
      - 'tests/**'
  workflow_dispatch: {}

# Prevent fork PRs (or any non-canonical-repo push) from running on the runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'PranavSlathia/XD' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, dh-dell]
    timeout-minutes: 15

    steps:
      - name: Sync repo on Dell
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          git fetch --prune origin
          git reset --hard origin/main

      - name: Ensure uv on PATH
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            if [ -x "$HOME/.local/bin/uv" ]; then
              echo "$HOME/.local/bin" >> $GITHUB_PATH
            else
              curl -fsSL https://astral.sh/uv/install.sh | sh
              echo "$HOME/.local/bin" >> $GITHUB_PATH
            fi
          fi

      - name: Install dev deps
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Lint
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run ruff check dh tests

      - name: Type check
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run basedpyright dh tests

      - name: Tests (unit)
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run pytest tests/ -q

  build:
    needs: test
    if: github.repository == 'PranavSlathia/XD' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, dh-dell]
    timeout-minutes: 15

    steps:
      - name: Sync repo on Dell
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          git fetch --prune origin
          git reset --hard origin/main

      - name: Build runtime images
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose build

      - name: Run database migrations
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose up -d dh-pg dh-redis
          docker compose run --rm dh-api uv run alembic upgrade head

      - name: Remove retired web container
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker rm -f dh-web 2>/dev/null || true

      - name: Deploy backend stack
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Sanity checks
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker exec dh-pg pg_isready -U dh -d dh
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8007/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 120 dh-api
          exit 1
