name: Build Domain Hunter backend

on:
  push:
    branches: [main]
    paths:
      - 'dh/**'
      - 'alembic/**'
      - 'Dockerfile.python'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'compose.yml'
      - '.github/workflows/build.yml'
      - 'tests/**'
  workflow_dispatch: {}

# Prevent fork PRs (or any non-canonical-repo push) from running on the runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'PranavSlathia/XD' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, dh-dell]
    timeout-minutes: 15

    steps:
      - name: Sync repo on Dell
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          git fetch --prune origin
          git reset --hard origin/main

      - name: Ensure uv on PATH
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            if [ -x "$HOME/.local/bin/uv" ]; then
              echo "$HOME/.local/bin" >> $GITHUB_PATH
            else
              curl -fsSL https://astral.sh/uv/install.sh | sh
              echo "$HOME/.local/bin" >> $GITHUB_PATH
            fi
          fi

      - name: Install dev deps
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Lint
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run ruff check dh tests

      - name: Type check
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run basedpyright dh tests

      - name: Tests (unit)
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run pytest tests/ -q

      - name: Tests (Postgres integration)
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          uv run pytest tests/ -m integration -q

  build:
    needs: test
    if: github.repository == 'PranavSlathia/XD' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, dh-dell]
    timeout-minutes: 15

    steps:
      - name: Sync repo on Dell
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          git fetch --prune origin
          git reset --hard origin/main

      - name: Build runtime images
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose build

      - name: Back up Domain Hunter database
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose up -d dh-pg
          ./scripts/backup-dh-pg.sh

      - name: Run database migrations
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose up -d dh-pg dh-redis
          docker compose run --rm dh-api uv run alembic upgrade head

      - name: Remove retired web container
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker rm -f dh-web 2>/dev/null || true

      - name: Remove retired or opt-in workers
        run: |
          set -euo pipefail
          for container in dh-scheduler dh-worker-a2 dh-worker-classifier dh-worker-registrar; do
            docker rm -f "$container" 2>/dev/null || true
          done

      - name: Deploy backend stack
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Sanity checks
        working-directory: /home/pronav/docker/domain-hunter
        run: |
          set -euo pipefail
          docker exec dh-pg pg_isready -U dh -d dh
          api_ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8007/health; then
              api_ready=1
              break
            fi
            sleep 2
          done
          if [ "$api_ready" -ne 1 ]; then
            echo "dh-api did not become healthy; recent logs:"
            docker logs --tail 120 dh-api || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8007/api/pipeline/status
          docker compose ps \
            dh-api dh-pg dh-redis vulture \
            dh-worker-inventory dh-worker-rdap dh-worker-wayback dh-worker-scoring
          if docker ps -a --format '{{.Names}}' | grep -qx 'dh-web'; then
            echo "retired dh-web container still exists"
            exit 1
          fi
          if ! docker compose ps --services --filter status=running | grep -qx 'vulture'; then
            echo "vulture is not running; recent logs:"
            docker logs --tail 120 vulture || true
            exit 1
          fi
          for service in dh-worker-inventory dh-worker-rdap dh-worker-wayback dh-worker-scoring; do
            if ! docker compose ps --services --filter status=running | grep -qx "$service"; then
              echo "$service is not running; recent logs:"
              docker logs --tail 120 "$service" || true
              exit 1
            fi
          done
