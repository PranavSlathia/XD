# Docker Compose for the headless Domain Hunter backend.
#
# `docker compose up -d` runs the autonomous discovery pipeline, programmatic
# API, and Vulture Discord operator. There is intentionally no DH-owned web UI.
#
# Confirmed on Dell (100.103.66.92):
#   - Docker 29.4.3, Compose v5.1.3
#   - 5436 + 6381 free (6380 is taken by moc-falkordb)
#   - /var/data/dh and /var/backups/dh created, owned by pronav

networks:
  dh-net:
    driver: bridge

volumes:
  dh-pg-data:
  dh-redis-data:

services:
  dh-pg:
    image: pgvector/pgvector:pg16
    container_name: dh-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DH_DB_NAME:-dh}
      POSTGRES_USER: ${DH_DB_USER:-dh}
      POSTGRES_PASSWORD: ${DH_DB_PASSWORD:?must be set in .env}
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:5436:5432"
    volumes:
      - dh-pg-data:/var/lib/postgresql/data
      - /var/backups/dh:/var/backups/dh
    networks: [dh-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DH_DB_USER:-dh} -d ${DH_DB_NAME:-dh}"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      autoheal: "true"

  dh-redis:
    image: redis:7-alpine
    container_name: dh-redis
    restart: unless-stopped
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:6381:6379"
    volumes:
      - dh-redis-data:/data
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      autoheal: "true"

  dh-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: dh-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "dh.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:8007:8000"
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  # Vulture - the Discord slash-command operator surface.
  vulture:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: vulture
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.bot"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.bot' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  # Primary discovery path: official pending-delete inventory intersected with
  # a current authority dataset. Read-only; it cannot place bids or purchases.
  dh-worker-inventory:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-inventory
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.inventory"]
    env_file: .env
    volumes:
      - /var/data/dh:/var/data/dh
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.inventory' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  dh-worker-rdap:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-rdap
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.rdap"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.rdap' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  dh-worker-wayback:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-wayback
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.wayback"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.wayback' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  dh-worker-scoring:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-scoring
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.scoring"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.scoring' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  # Typed operator jobs and the bounded content crawler. This worker has no
  # Docker socket and no shell-command API; every job kind is allowlisted in
  # Python and claimed from Postgres with SKIP LOCKED.
  dh-worker-operator:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-operator
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.operator"]
    env_file: .env
    mem_limit: 256m
    cpus: 0.35
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.operator' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  dh-worker-registrar:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-registrar
    restart: unless-stopped
    profiles: ["hand-registration"]
    command: ["uv", "run", "python", "-m", "dh.workers.registrar"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); sys.exit(0 if 'dh.workers.registrar' in cmd else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"
