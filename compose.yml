# Docker Compose for the headless Domain Hunter backend.
#
# `docker compose up -d` runs the autonomous discovery pipeline plus the
# programmatic API. There is intentionally no DH-owned web UI and no Discord bot.
# Human interaction belongs to the external agent layer (Quip/Codex/Gemini).
#
# Confirmed on Dell (100.103.66.92):
#   - Docker 29.4.3, Compose v5.1.3
#   - 5436 + 6381 free (6380 is taken by moc-falkordb)
#   - /var/data/dh and /var/backups/dh created, owned by pronav

networks:
  dh-net:
    driver: bridge

volumes:
  dh-pg-data:
  dh-redis-data:

services:
  dh-pg:
    image: pgvector/pgvector:pg16
    container_name: dh-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DH_DB_NAME:-dh}
      POSTGRES_USER: ${DH_DB_USER:-dh}
      POSTGRES_PASSWORD: ${DH_DB_PASSWORD:?must be set in .env}
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:5436:5432"
    volumes:
      - dh-pg-data:/var/lib/postgresql/data
      - /var/backups/dh:/var/backups/dh
    networks: [dh-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DH_DB_USER:-dh} -d ${DH_DB_NAME:-dh}"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      autoheal: "true"

  dh-redis:
    image: redis:7-alpine
    container_name: dh-redis
    restart: unless-stopped
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:6381:6379"
    volumes:
      - dh-redis-data:/data
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      autoheal: "true"

  dh-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: dh-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "dh.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    ports:
      - "${DH_BIND_ADDR:-127.0.0.1}:8007:8000"
    networks: [dh-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      autoheal: "true"

  dh-scheduler:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-scheduler
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.scheduler"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-a2:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-a2
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.a2"]
    env_file: .env
    volumes:
      - /var/data/dh:/var/data/dh
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-rdap:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-rdap
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.rdap"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-wayback:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-wayback
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.wayback"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-classifier:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-classifier
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.classifier"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-scoring:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-scoring
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.scoring"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"

  dh-worker-registrar:
    build: { context: ., dockerfile: Dockerfile.python }
    container_name: dh-worker-registrar
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "dh.workers.registrar"]
    env_file: .env
    depends_on:
      dh-pg: { condition: service_healthy }
      dh-redis: { condition: service_healthy }
    networks: [dh-net]
    labels:
      autoheal: "true"
